<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Gurugram Startup &amp; Job Market Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1C;
    --panel:#111A2C;
    --panel-alt:#0D1424;
    --border:#223049;
    --border-soft:#1A2438;
    --text:#EAF1FB;
    --text-muted:#8496B8;
    --text-dim:#556680;
    --gold:#E7A94C;
    --gold-dim:#a97f3d;
    --teal:#34D6A8;
    --red:#E76F51;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::selection{background:var(--gold);color:#0A0F1C;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--panel-alt);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

  a{color:inherit;}

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- HEADER ---------- */
  header.top{
    display:flex;
    align-items:center;
    gap:20px;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #0D1526 0%, #0A0F1C 100%);
    z-index:50;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-right:auto;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.16em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .brand h1{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-.01em;
  }
  .brand h1 span{color:var(--text-muted);font-weight:500;}

  .searchwrap{
    position:relative;
    width:280px;
    max-width:42vw;
  }
  .searchwrap input{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px 9px 32px;
    border-radius:8px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .15s;
  }
  .searchwrap input:focus{border-color:var(--gold-dim);}
  .searchwrap svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;stroke:var(--text-muted);
  }

  .viewtoggle{
    display:flex;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .viewtoggle button{
    background:transparent;
    border:none;
    color:var(--text-muted);
    padding:8px 14px;
    font-size:12.5px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
    cursor:pointer;
    transition:.15s;
  }
  .viewtoggle button.active{
    background:var(--gold);
    color:#0A0F1C;
    font-weight:700;
  }

  .filtertoggle{
    display:none;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
  }

  /* ---------- TICKER (signature element) ---------- */
  .ticker{
    display:flex;
    align-items:center;
    gap:0;
    border-bottom:1px solid var(--border);
    background:var(--panel-alt);
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:34px;
  }
  .ticker .ticker-track{
    display:flex;
    align-items:center;
    gap:34px;
    padding-left:100%;
    animation:scroll-ticker 38s linear infinite;
  }
  .ticker:hover .ticker-track{animation-play-state:paused;}
  @keyframes scroll-ticker{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }
  .ticker-item{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
    letter-spacing:.03em;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .ticker-item b{color:var(--gold);font-weight:700;}
  .ticker-item .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);}

  /* ---------- BODY LAYOUT ---------- */
  .body{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---------- SIDEBAR ---------- */
  aside.sidebar{
    width:272px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:16px 16px 40px;
  }
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .sidebar-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0;
    color:var(--text-muted);
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--gold);
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--gold);}

  .filter-group{
    margin-bottom:18px;
    border-bottom:1px solid var(--border-soft);
    padding-bottom:14px;
  }
  .filter-group:last-child{border-bottom:none;}
  .filter-group-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--text);
    margin-bottom:9px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .filter-group-title .tag-icon{color:var(--gold);}

  .filter-option{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 4px;
    border-radius:6px;
    cursor:pointer;
    font-size:12.8px;
    color:var(--text-muted);
    transition:.12s;
  }
  .filter-option:hover{background:var(--panel-alt);color:var(--text);}
  .filter-option input{accent-color:var(--gold);width:13px;height:13px;flex-shrink:0;}
  .filter-option .count{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim,#556);
    opacity:.65;
  }
  .filter-option.checked{color:var(--text);}
  .filter-option .swatch{
    width:9px;height:9px;border-radius:2px;flex-shrink:0;
  }

  /* ---------- MAIN ---------- */
  main.mapmain{
    flex:1;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute;
    inset:0;
    background:#0c1220;
  }

  .legend{
    position:absolute;
    left:14px;
    bottom:18px;
    z-index:400;
    background:rgba(17,26,44,.92);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    max-width:220px;
    backdrop-filter:blur(6px);
    font-size:11px;
  }
  .legend h4{
    margin:0 0 7px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .legend-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--text-muted);}
  .legend-row .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .resultcount{
    position:absolute;
    top:14px;right:14px;
    z-index:400;
    background:rgba(17,26,44,.92);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
    backdrop-filter:blur(6px);
  }
  .resultcount b{color:var(--gold);}

  /* ---------- LIST VIEW ---------- */
  .listview{
    position:absolute;
    inset:0;
    overflow-y:auto;
    padding:20px;
    display:none;
    background:var(--bg);
  }
  .listview.active{display:block;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:.15s;
  }
  .card:hover{border-color:var(--gold-dim);transform:translateY(-1px);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-top h3{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:600;
  }
  .card .area{
    font-size:11.5px;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
  }
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .badge{
    font-size:10.2px;
    font-family:'JetBrains Mono',monospace;
    padding:3px 7px;
    border-radius:5px;
    border:1px solid var(--border);
    color:var(--text-muted);
    letter-spacing:.02em;
  }
  .badge.stage{color:var(--gold);border-color:rgba(231,169,76,.35);}
  .card .note{font-size:12px;color:var(--text-muted);line-height:1.45;margin:2px 0 4px;}
  .card-links{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;}
  .card-links a{
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--border);
    color:var(--text);
    text-decoration:none;
    transition:.12s;
  }
  .card-links a:hover{border-color:var(--gold);color:var(--gold);}
  .card-links a.primary{background:var(--gold);color:#0A0F1C;border-color:var(--gold);font-weight:700;}
  .card-links a.primary:hover{color:#0A0F1C;opacity:.9;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
  }

  /* ---------- LEAFLET OVERRIDES ---------- */
  .leaflet-popup-content-wrapper{
    background:var(--panel);
    color:var(--text);
    border-radius:12px;
    border:1px solid var(--border);
  }
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 14px;min-width:210px;}
  .popup-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .popup-area{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
  .popup-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .popup-note{font-size:11.8px;color:var(--text-muted);line-height:1.4;margin-bottom:10px;}
  .popup-links{display:flex;gap:6px;flex-wrap:wrap;}
  .popup-links a{
    font-size:10.5px;font-family:'JetBrains Mono',monospace;
    padding:5px 8px;border-radius:5px;border:1px solid var(--border);
    text-decoration:none;color:var(--text);
  }
  .popup-links a.primary{background:var(--gold);color:#0A0F1C;border-color:var(--gold);font-weight:700;}
  .leaflet-container a.leaflet-popup-close-button{color:var(--text-muted);}
  .divmarker{
    display:flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(10,15,28,.9);
    box-shadow:0 0 0 2px rgba(0,0,0,.15);
  }
  .divmarker.pulse::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;
    border:1px solid rgba(231,169,76,.5);
  }

  /* ---------- MOBILE ---------- */
  .sidebar-backdrop{
    display:none;
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:499;
  }
  @media (max-width:860px){
    header.top{padding:10px 14px;gap:10px;}
    .brand h1{font-size:16px;}
    .searchwrap{width:100%;max-width:none;order:3;flex-basis:100%;}
    .filtertoggle{display:inline-flex;align-items:center;gap:6px;}
    aside.sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      z-index:500;
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:20px 0 40px rgba(0,0,0,.4);
    }
    aside.sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.open{display:block;}
    .legend{display:none;}
    .resultcount{font-size:10.5px;padding:6px 9px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="eyebrow">Millennium City &middot; Corporate Ecosystem Index</div>
      <h1>Gurugram Startup <span>&amp;</span> Job Market Map</h1>
    </div>

    <button class="filtertoggle" id="filterToggleBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filters

    <div class="searchwrap">

      <input id="searchInput" type="text" placeholder="Search company, area, sector…" autocomplete="off" />

    <div class="viewtoggle">

      <button id="listBtn">LIST</button>
    </div>
  </header>

  <div class="ticker">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>Filter Ecosystem</h2>
        <button class="reset-btn" id="resetBtn">RESET</button>
      </div>

      <div class="filter-group">
        <div class="filter-group-title"><span class="tag-icon">&#9679;</span> Areas / Locations</div>
        <div id="areaFilters"></div>
      </div>

      <div class="filter-group">
        <div class="filter-group-title"><span class="tag-icon">&#9679;</span> Company Stage</div>
        <div id="stageFilters"></div>

      <div class="filter-group">
        <div class="filter-group-title"><span class="tag-icon">&#9679;</span> Job Market Sector</div>
        <div id="sectorFilters"></div>
      </div>
    </aside>

    <main class="mapmain">
      <div id="map"></div>
      <div class="resultcount" id="resultCount"></div>
      <div class="legend" id="legend">
        <h4>Sector Key</h4>
        <div id="legendRows"></div>
      </div>

      <div class="listview" id="listView">
        <div class="grid" id="cardGrid"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  "D2C & Beauty/Wellness","AI & Deeptech","Proptech & Real Estate Tech"

  "Fintech & Insurtech":"#E7A94C",
  "Consumer Tech & E-commerce":"#34D6A8",
  "Autotech & Mobility":"#5DA9E9",
  "B2B & OfBusiness/Logistics":"#B98CE0",
  "Healthtech & Medtech":"#F27F8C",

};

/* ====================== STATE ====================== */
const state = { areas:new Set(), stages:new Set(), sectors:new Set(), q:"" };
let view = "map";

/* ====================== HELPERS ====================== */
function countBy(list, key){
  const m = {};
  list.forEach(c => m[c[key]] = (m[c[key]]||0)+1);
  return m;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildFilterGroup(containerId, options, stateSet, keyName, colorMap){
  const el = document.getElementById(containerId);
  const counts = countBy(COMPANIES, keyName);
  el.innerHTML = options.map(opt => {
    const c = counts[opt]||0;
    const sw = colorMap ? `<span class="swatch" style="background:${colorMap[opt]}"></span>` : "";
    return `<label class="filter-option" data-val="${esc(opt)}">
      <input type="checkbox" data-key="${keyName}" value="${esc(opt)}" />
      ${sw}<span>${esc(opt)}</span>
      <span class="count">${c}</span>
    </label>`;
  }).join("");
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const v = cb.value;
      if(cb.checked) stateSet.add(v); else stateSet.delete(v);
      cb.closest('.filter-option').classList.toggle('checked', cb.checked);
      applyFilters();
    });
  });
}

function getFiltered(){
  const q = state.q.trim().toLowerCase();
  return COMPANIES.filter(c=>{
    if(state.areas.size && !state.areas.has(c.area)) return false;
    if(state.stages.size && !state.stages.has(c.stage)) return false;
    if(state.sectors.size && !state.sectors.has(c.sector)) return false;
    if(q){
      const hay = (c.name+" "+c.area+" "+c.sector+" "+c.stage).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ====================== MAP ====================== */
const map = L.map('map', {zoomControl:true}).setView([28.4595, 77.0480], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19, subdomains: 'abcd'
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);

function popupHtml(c){
  return `<div class="popup-name">${esc(c.name)}</div>
  <div class="popup-area">${esc(c.area)}</div>
  <div class="popup-badges">
    <span class="badge stage" style="display:inline-block;font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 7px;border-radius:5px;border:1px solid rgba(231,169,76,.35);color:#E7A94C;">${esc(c.stage)}</span>
    <span class="badge" style="display:inline-block;font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 7px;border-radius:5px;border:1px solid #223049;color:#8496B8;">${esc(c.sector)}</span>
  </div>
  <div class="popup-note">${esc(c.note||"")}</div>
  <div class="popup-links">
    <a class="primary" href="${c.website}" target="_blank" rel="noopener">Website</a>
    <a href="${c.careers}" target="_blank" rel="noopener">Careers</a>
    <a href="${c.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
  </div>`;
}

function renderMarkers(list){
  markerLayer.clearLayers();
  list.forEach(c=>{
    const color = SECTOR_COLORS[c.sector] || "#E7A94C";
    const icon = L.divIcon({
      className:'',
      html:`<div class="divmarker" style="background:${color}"></div>`,
      iconSize:[16,16], iconAnchor:[8,8]
    });
    const m = L.marker([c.lat, c.lng], {icon}).bindPopup(popupHtml(c), {closeButton:true, maxWidth:260});
    m.addTo(markerLayer);
  });
}

/* ====================== LIST VIEW ====================== */
function renderCards(list){
  const grid = document.getElementById('cardGrid');
  if(!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No companies match these filters.<br/>Try clearing a filter or search term.</div>`;
    return;
  }
  grid.innerHTML = list.map(c=>`
    <div class="card">
      <div class="card-top">
        <h3>${esc(c.name)}</h3>
      </div>
      <div class="area">${esc(c.area)}</div>
      <div class="badges">
        <span class="badge stage">${esc(c.stage)}</span>
        <span class="badge">${esc(c.sector)}</span>
      </div>
      <div class="note">${esc(c.note||"")}</div>
      <div class="card-links">
        <a class="primary" href="${c.website}" target="_blank" rel="noopener">Website</a>
        <a href="${c.careers}" target="_blank" rel="noopener">Careers</a>
        <a href="${c.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  `).join('');
}

/* ====================== LEGEND ====================== */
function renderLegend(){
  const el = document.getElementById('legendRows');
  el.innerHTML = SECTORS.map(s=>`<div class="legend-row"><span class="sw" style="background:${SECTOR_COLORS[s]}"></span>${esc(s)}</div>`).join('');
}

/* ====================== TICKER ====================== */
function renderTicker(){
  const total = COMPANIES.length;
  const unicorns = COMPANIES.filter(c=>c.stage==="Unicorn").length;
  const gccs = COMPANIES.filter(c=>c.stage==="Global Captives / GCCs").length;
  const pub = COMPANIES.filter(c=>c.stage==="Public / Enterprise").length;
  const growth = COMPANIES.filter(c=>c.stage==="Series C+ / Growth"||c.stage==="Series A & B").length;
  const items = [
    `<span class="dot"></span> TOTAL ENTITIES <b>${total}</b>`,
    `UNICORNS <b>${unicorns}</b>`,
    `GLOBAL CAPABILITY CENTERS <b>${gccs}</b>`,
    `PUBLIC / ENTERPRISE <b>${pub}</b>`,
    `SERIES A&ndash;C+ SCALE-UPS <b>${growth}</b>`,
    `AREAS TRACKED <b>${AREAS.length}</b>`,
    `SECTORS TRACKED <b>${SECTORS.length}</b>`
  ];
  const track = document.getElementById('tickerTrack');
  const html = items.map(i=>`<span class="ticker-item">${i}</span>`).join('<span class="ticker-item">&mdash;</span>');
  track.innerHTML = html + html; // duplicate for seamless loop
}

/* ====================== APPLY ====================== */
function applyFilters(){
  const list = getFiltered();
  renderMarkers(list);
  renderCards(list);
  document.getElementById('resultCount').innerHTML = `<b>${list.length}</b> / ${COMPANIES.length} companies shown`;
}

/* ====================== INIT ====================== */
buildFilterGroup('areaFilters', AREAS, state.areas, 'area', null);
buildFilterGroup('stageFilters', STAGES, state.stages, 'stage', null);
buildFilterGroup('sectorFilters', SECTORS, state.sectors, 'sector', SECTOR_COLORS);
renderLegend();
renderTicker();
applyFilters();

document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value;
  applyFilters();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.areas.clear(); state.stages.clear(); state.sectors.clear(); state.q="";
  document.getElementById('searchInput').value="";
  document.querySelectorAll('.sidebar input[type=checkbox]').forEach(cb=>{cb.checked=false; cb.closest('.filter-option').classList.remove('checked');});
  applyFilters();
});

document.getElementById('mapBtn').addEventListener('click', ()=>{
  view='map';
  document.getElementById('mapBtn').classList.add('active');
  document.getElementById('listBtn').classList.remove('active');
  document.getElementById('listView').classList.remove('active');
  setTimeout(()=>map.invalidateSize(), 50);
});
document.getElementById('listBtn').addEventListener('click', ()=>{
  view='list';
  document.getElementById('listBtn').classList.add('active');
  document.getElementById('mapBtn').classList.remove('active');
  document.getElementById('listView').classList.add('active');
});

/* mobile sidebar */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebarBackdrop');
document.getElementById('filterToggleBtn').addEventListener('click', ()=>{
  sidebar.classList.add('open'); backdrop.classList.add('open');
});
backdrop.addEventListener('click', ()=>{
  sidebar.classList.remove('open'); backdrop.classList.remove('open');
});

window.addEventListener('resize', ()=> map.invalidateSize());
</script>
</body>
</html>
